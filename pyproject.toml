[project]
name = "wolfram-llmgraph"
version = "0.1.0"
description = "A Wolfram LLMGraph-style runtime built on LangGraph, with a CLI. Declarative graphs of LLM and code nodes with automatic dependency inference and concurrent scheduling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wolfram_agents = "wolfram_agents.cli:main"
wolfram-agents = "wolfram_agents.cli:main"
llmgraph = "wolfram_llmgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wolfram_llmgraph", "src/wolfram_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
